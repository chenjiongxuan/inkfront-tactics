<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182827">
<title>墨线守城 · Inkfront</title>
<style>
:root{--ink:#111a19;--paper:#f0e2c6;--gold:#f5cd70;--teal:#9fc5b9;--red:#d78172}
*{box-sizing:border-box}
body{margin:0;background:#101817;color:var(--paper);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
.shell{width:min(100%,480px);min-height:100dvh;margin:auto;background:linear-gradient(#344a43,#1c3030 55%,#152424);box-shadow:0 0 0 5px #0d1413,0 0 50px #080d0d}
.screen{display:none;padding:11px 12px 22px}
.screen.active{display:block}
.sketch{border:3px solid #101817;border-radius:11px 8px 12px 9px;box-shadow:3px 4px #091211,inset 0 0 0 2px #ffffff1c}
.bar{display:flex;align-items:center;justify-content:space-between;gap:7px}
.brand{color:#f7d47c;text-shadow:2px 3px #111b19;font-size:21px;font-weight:1000;letter-spacing:.05em}
.pill{background:#435c53;border:2px solid #111b19;border-radius:13px;box-shadow:2px 3px #101817;font-size:12px;font-weight:900;padding:5px 7px;white-space:nowrap}
.pill b{color:#ffdb8b}
.cta,.minor{border:3px solid #121918;border-radius:10px 8px 12px 9px;font-weight:1000;box-shadow:3px 4px #0b1312}
.cta{background:linear-gradient(#ffdf83,#daa346);color:#2c2217;padding:10px;font-size:17px}
.minor{background:#a4bfb3;color:#1c2925;padding:7px 10px}
.cta:active,.minor:active,.shop-card:active{transform:translate(2px,2px)}
.rank{text-align:center;margin:13px 0;padding:17px 8px;background:radial-gradient(#527165,#263f3c)}
.rank h1{font-size:29px;margin:5px 0}
.rank small{color:#d2dac9}
.stars{color:var(--gold);font-size:25px;letter-spacing:4px;text-shadow:2px 2px #121a19}
.home-art{height:190px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 105%,#817a60 0 29%,transparent 30%),linear-gradient(#466c67,#2e4b49)}
.moon{position:absolute;right:31px;top:22px;width:49px;height:49px;border-radius:50%;background:#e1d9aa;box-shadow:0 0 0 7px #ddd8a739}
.home-squad{position:absolute;bottom:19px;left:0;right:0;text-align:center;font-size:56px;filter:drop-shadow(3px 4px #162321)}
.intro{font-size:14px;line-height:1.55;color:#e0e7d9;margin:16px 4px}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.home-actions .cta{grid-column:1/3}
.section-label{font-size:13px;font-weight:1000;color:#f2d895;margin:13px 2px 7px;letter-spacing:.04em}
.chests{display:flex;gap:6px;margin:8px 0}
.chest{flex:1;background:#425a54;color:#f1e2b9;border:2px solid #111b19;border-radius:7px;padding:8px 2px;font-size:12px;font-weight:900}
.chest.ready{background:#887949}
.footer-note{font-size:11px;text-align:center;color:#b8c9bd;margin-top:15px}
.battle-head{margin-bottom:8px}
.battle-head .brand{font-size:19px}
.battle-stats{display:flex;justify-content:space-between;gap:3px;margin-bottom:7px}
.battle-stats .pill{font-size:11px;padding:4px 5px}
.arena,.board{display:block;width:100%;height:auto;touch-action:none;background:#344c46}
.arena{border-radius:10px 10px 0 0;border-bottom:0}
.board{border-radius:0 0 10px 10px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.meter{background:#20302e;border:2px solid #101817;border-radius:8px;padding:3px 5px;font-size:11px;font-weight:900}
.meter-track{height:8px;margin-top:3px;background:#111b19;border-radius:4px;overflow:hidden}
.meter-track i{display:block;height:100%;background:#98be9d}
.meter.enemy .meter-track i{background:#d47d71}
.caption{margin-top:8px;min-height:39px;background:#243733;border-left:4px solid #f0c976;padding:7px 9px;line-height:1.35;font-size:12px;color:#e1e9d9}
.controls{display:flex;gap:7px;margin-top:8px}
.controls button{flex:1}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.shop-card{min-height:99px;background:#dcc69e;color:#272820;border:3px solid #121918;border-radius:8px 12px 8px 10px;box-shadow:3px 4px #0e1715;padding:4px 2px;text-align:center}
.shop-card.selected{outline:3px solid #f8dc6b;background:#f1dfa9}
.shop-card .icon{display:block;font-size:27px;line-height:34px}
.shop-card b{display:block;font-size:14px}
.shop-card small{display:block;font-size:10px;color:#604f3d}
.shop-card strong{font-size:11px;color:#8a4b2f}
.shop-card:disabled{opacity:.55}
.route-preview{font-size:11px;color:#d9e7d8;background:#253a35;border:1px solid #678a7c;border-radius:5px;padding:6px 8px;margin-top:7px;line-height:1.35}
.route-preview.safe{border-color:#89c3a4;background:#254239}.route-preview.danger{border-color:#ed8574;background:#572e31;color:#ffe1d4}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.howto span{background:#203632;border:1px solid #58766d;border-radius:6px;padding:5px 4px;text-align:center;font-size:10px;line-height:1.4;color:#e8e8d4}.howto b{color:#ffda84}
.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.numbers div{background:#19312e;border:1px solid #70938a;border-radius:6px;text-align:center;padding:5px 2px}.numbers small{display:block;color:#a9c5b9;font-size:10px}.numbers b{display:block;color:#ffdf91;font-size:15px}
.shop-card strong{display:block;margin-top:4px}.shop-card strong em,.shop-card strong i{font-style:normal;border-radius:4px;padding:2px 3px;font-size:10px}.shop-card strong em{background:#5baecb;color:#102a34}.shop-card strong i{background:#edc36e;color:#382912}
.pill.loss b{color:#f59a85}.board-title{display:flex;justify-content:space-between;align-items:center;margin:8px 1px 5px;font-size:11px;color:#dfebdc}.board-title strong{color:#f9da89;font-size:12px}
.enemy-info{background:#263632;border:1px solid #755a51;color:#f1d6bb;border-radius:0 0 6px 6px;padding:5px 7px;font-size:11px;text-align:center}
.shop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.shop-actions .cta{font-size:16px}
.shop-actions .minor{background:#86adb0}
.legend{font-size:11px;line-height:1.55;color:#c9d8c9;background:#1d302d;border-radius:6px;padding:7px 8px}
.modal-wrap{display:none;position:fixed;inset:0;background:#06110ed1;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal-wrap.show{display:flex}
.modal{width:min(100%,390px);background:#deceb0;color:#242820;border:4px solid #151b19;border-radius:13px 8px 15px 10px;box-shadow:7px 8px #040807;padding:20px;line-height:1.55}
.modal h2{margin:0 0 10px}
.modal p{margin:8px 0}
.modal .cta{width:100%;margin-top:13px}
.reward{text-align:center;font-size:39px}
@media(min-width:700px){body{padding:16px}.shell{border-radius:14px;overflow:hidden}}
@media(max-width:355px){.screen{padding:9px}.brand{font-size:19px}.battle-head .brand{font-size:16px}.battle-stats .pill{font-size:10px}.shop-card b{font-size:12px}}
/* Portrait battle composition: battlefield, route board, then construction cards. */
#battle{padding:6px 8px 8px;min-height:100dvh;background:linear-gradient(#365445,#274d35 78%,#2e5b29)}
#battle .battle-head{height:29px;margin:0 0 4px}
#battle .battle-head .brand{font-size:16px}
#battle .battle-head .minor{padding:3px 7px;font-size:11px;border-width:2px;box-shadow:1px 2px #0b1312}
#battle .battle-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:0 0 4px}
#battle .battle-stats .pill{padding:2px 1px;text-align:center;font-size:10px;border-width:1px;box-shadow:none;border-radius:5px;background:#243d34}
.top-values{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:3px}
.top-values span{font-size:10px;white-space:nowrap;text-align:center;border:1px solid #729682;background:#1c3b31;border-radius:4px;padding:2px 0;color:#d1dfcf}
.top-values b{font-size:12px;color:#ffe099}
.fort-values{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:3px}
.fort-values div{display:flex;align-items:center;gap:4px;min-width:0;font-size:9px;background:#1b322a;border:1px solid #547f65;border-radius:4px;padding:2px 4px}
.fort-values b{color:#f6deb1;font-size:10px;white-space:nowrap}.fort-values i{flex:1;height:4px;min-width:9px;background:#132a22;border-radius:4px;overflow:hidden}.fort-values em{display:block;height:100%;background:#a5cba1}.fort-values div+div em{background:#d78373}
.battle-subline{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:17px;margin-bottom:3px;font-size:10px;color:#ecdbbd}
.battle-subline #enemyInfo{flex:none;white-space:nowrap}.battle-subline .route-preview{flex:1;min-width:0;margin:0;padding:0;border:0;background:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:#c7edbb}.battle-subline .route-preview.danger{color:#ffab9d}
.arena-wrap,.board-wrap{position:relative;width:min(100%,calc(70dvh - 182px));margin-inline:auto}
#battle .arena,#battle .board{display:block;width:100%;height:auto;border:2px solid #14251e;box-shadow:none}
#battle .arena{border-radius:7px 7px 0 0;border-bottom:0}
#battle .board{border-radius:0 0 8px 8px}
.arena-wrap .controls{position:absolute;right:6px;top:6px;display:flex;gap:3px;margin:0;z-index:2}
.arena-wrap .controls button{flex:none;padding:2px 5px;font-size:10px;background:#548375e8;border:1px solid #1a3b31;border-radius:5px;box-shadow:1px 2px #10241d;color:#fff1c8}
.board-wrap .caption{position:absolute;bottom:5px;left:9%;right:9%;margin:0;min-height:0;max-height:32px;overflow:hidden;border:1px solid #dbb960;border-radius:5px;background:#1c332fdd;padding:2px 5px;text-align:center;line-height:1.2;font-size:10px;pointer-events:none}
.build-head{display:flex;justify-content:space-between;gap:4px;align-items:center;margin:4px 2px;font-size:10px;color:#f8dd96}.build-head span{color:#e6e7ca;font-size:9px;white-space:nowrap}.build-head i{display:inline-block;width:9px;height:9px;border:2px solid #1a322b;border-radius:50%;vertical-align:-1px}.build-head .open-end{background:#64c3dd}.build-head .nozzle-end{background:#ebbd65;border-radius:2px}
.build-row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px}
#battle .shop{gap:4px}
#battle .shop-card{min-height:92px;padding:1px 1px 3px;border-width:2px;border-radius:5px;background:linear-gradient(#f4dba7,#c89f64);box-shadow:1px 2px #0f2119;overflow:hidden}
#battle .shop-card .pipe-art{display:block;height:56px;margin:auto;max-width:100%}
#battle .shop-card b{font-size:11px;line-height:13px;white-space:nowrap}
#battle .shop-card small{font-size:9px;line-height:11px}
#battle .shop-card strong{display:none}
#battle .refresh{padding:2px;font-size:21px;background:#69bfd1;border-width:2px;border-radius:6px;box-shadow:1px 2px #123226;color:#183d42}
#battle .refresh small{display:block;font-size:9px;line-height:11px;color:#1a3435}
#battle .recruit{display:block;width:58%;margin:5px auto 0;padding:4px 6px;border-width:2px;border-radius:8px;font-size:13px;box-shadow:2px 3px #132718}
@media(max-height:720px){#battle{padding-top:3px}.arena-wrap,.board-wrap{width:min(100%,calc(70dvh - 171px))}#battle .shop-card{min-height:82px}#battle .shop-card .pipe-art{height:48px}.build-head{margin:2px}.battle-subline{min-height:14px}}
</style>
</head>
<body>
<div class="shell">
<main id="home" class="screen active">
  <div class="bar"><div class="brand">✦ 墨线守城</div><div class="pill">🪙 <b id="homeCoins">0</b>　⚡ <b id="homeEnergy">0</b>/20</div></div>
  <section class="rank sketch"><small>黑石关 · 战争工坊</small><h1 id="rankName">青铜 · I</h1><div class="stars" id="rankStars">☆☆☆☆☆</div><small id="winCount">累计胜利 0 场</small></section>
  <div class="home-art sketch"><div class="moon"></div><div class="home-squad">🛡️　⚔️　🏹</div></div>
  <p class="intro">每场随机生成石头。士兵从营帐沿最短路前进；Buff 的蓝色入口、金色出口可改变方向。接对路线，带着加成出征；接错就会阵亡。</p>
  <div class="home-actions"><button id="startGame" class="cta">⚔ 开始守城　<small>⚡ 5</small></button><button id="helpHome" class="minor">玩法说明</button><button id="resetBtn" class="minor">重置存档</button></div>
  <div class="section-label">荣耀宝箱 · 胜利后获得</div><div class="chests" id="chests"></div>
  <div class="footer-note">公开网页可直接玩 · 进度仅占当前浏览器少量存储</div>
</main>
<main id="battle" class="screen">
  <div class="bar battle-head"><button id="toHome" class="minor">‹ 营地</button><div class="brand">战争工坊</div><button id="helpBattle" class="minor">玩法 ?</button></div>
  <div class="battle-stats" aria-label="战斗进度">
    <div class="pill">🌊 <b id="waveLabel">1/5</b></div>
    <div class="pill">⏱ <b id="timeLabel">3:10</b></div>
    <div class="pill">🍖 <b id="meatLabel">0</b></div>
    <div class="pill">⚙ <b id="beltLabel">0</b></div>
    <div class="pill loss">☠ <b id="lossLabel">0</b></div>
  </div>
  <div class="top-values" aria-label="预计出征数值"><span>攻 <b id="attackValue">10</b></span><span>生命 <b id="hpValue">30</b></span><span>护甲 <b id="armorValue">2</b></span><span>攻速 <b id="rateValue">×1</b></span></div>
  <div class="fort-values"><div>我方 <b id="fortLabel">220/220</b><i><em id="fortBar"></em></i></div><div>敌堡 <b id="enemyFortLabel">1600/1600</b><i><em id="enemyFortBar"></em></i></div></div>
  <div class="battle-subline"><span id="enemyInfo">敌兵生命 29 · 攻击 5</span><span id="routePreview" class="route-preview">✓ 路线安全</span></div>
  <div class="arena-wrap"><canvas id="arena" class="arena sketch" width="420" height="180" aria-label="实时攻城战场"></canvas><div class="controls"><button id="pauseBtn" class="minor">启动</button><button id="speedBtn" class="minor">×1</button></div></div>
  <div class="board-wrap"><canvas id="board" class="board sketch" width="420" height="421" aria-label="营帐、格内路线、增益和出口棋盘"></canvas><div class="caption" id="caption" aria-live="polite"></div></div>
  <div class="build-head"><strong id="draftLabel">三选一 · 选择后放到棋盘</strong><span><i class="open-end"></i> 吸入口　<i class="nozzle-end"></i> 喷嘴</span></div>
  <div class="build-row"><div id="shop" class="shop"></div><button id="refreshBtn" class="minor refresh">↻<small>刷新<br>10</small></button></div>
  <button id="recruitBtn" class="cta recruit">🍖 招募士兵 20</button>
</main>
</div>
<div id="modalWrap" class="modal-wrap"><div id="modal" class="modal"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SAVE='inkfront-tactics-v1';
let save;
try{save=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}
save=Object.assign({coins:120,energy:20,wins:0,chests:0},save||{});
const persist=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};
const arena=$('#arena'),ac=arena.getContext('2d'),board=$('#board'),bc=board.getContext('2d');
const BX=54,BY=53,T=52,N=6,EXIT={x:0,y:5};
const STEP_MS=440,WAVE_MS=38000,MAX_WAVES=5,SPAWN_END=190000,FINAL_BOSS_AT=157000;
const sideNames=['左','下','右','上'];
const cards={
 attack:{name:'锋芒',icon:'⚔',desc:'攻击 +10%',color:'#f0c875'},
 defense:{name:'护甲',icon:'🛡',desc:'护甲 +2',color:'#91bad1'},
 shield:{name:'护盾',icon:'⬡',desc:'生命 +5',color:'#a9c5d3'},
 haste:{name:'急行',icon:'✦',desc:'攻速 +15%',color:'#c7b4df'},
 mult11:{name:'倍率 ×1.1',icon:'×1.1',desc:'放大当前属性',color:'#b6d888'},
 mult13:{name:'倍率 ×1.3',icon:'×1.3',desc:'放大当前属性',color:'#e5ad7c'},
 tent:{name:'营帐',icon:'⌂',desc:'额外产兵',color:'#e8d6aa'}
};
const outer=[{x:80,y:339},{x:27,y:339},{x:27,y:391},{x:392,y:391},{x:392,y:28},{x:28,y:28}];
const outerLens=[53,52,365,363,364],outerLen=outerLens.reduce((a,b)=>a+b,0);
const dirs=[[-1,0],[0,1],[1,0],[0,-1]];
let g=null,chosen=-1,selectedTile=null,pointerStart=null,raf=0,last=0,audio=null;
function sound(f=520,d=.07){
  try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.62,audio.currentTime+d);v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}
}
function show(id){document.querySelector('.screen.active').classList.remove('active');$(id).classList.add('active');scrollTo(0,0)}
function modal(title,body,button,action){
  $('#modal').innerHTML='<h2>'+title+'</h2><div>'+body+'</div><button id="modalOk" class="cta">'+(button||'好的')+'</button>';
  $('#modalWrap').classList.add('show');
  $('#modalOk').onclick=()=>{$('#modalWrap').classList.remove('show');if(action)action()}
}
function home(){
  show('#home');
  $('#homeCoins').textContent=save.coins;
  $('#homeEnergy').textContent=save.energy;
  $('#winCount').textContent='累计胜利 '+save.wins+' 场';
  $('#rankName').textContent=['青铜','白银','黄金','星耀'][Math.min(3,Math.floor(save.wins/5))]+' · '+['I','II','III','IV','V'][save.wins%5];
  $('#rankStars').textContent='★'.repeat(save.wins%5)+'☆'.repeat(5-save.wins%5);
  $('#chests').innerHTML=Array.from({length:4},(_,i)=>'<button class="chest '+(i<save.chests?'ready':'')+'" data-chest="'+i+'">'+(i<save.chests?'🎁 开启':'▣ 空箱')+'</button>').join('');
  document.querySelectorAll('.chest.ready').forEach(e=>e.onclick=()=>{save.chests--;save.coins+=50;persist();sound(820,.2);modal('宝箱开启','<p class="reward">🪙 +50</p><p>获得 50 金币。</p>','收下',home)})
}
function tileAt(x,y,tiles=g.tiles){return tiles.find(t=>t.x===x&&t.y===y)}
function tileById(id){return g.tiles.find(t=>t.id===id)}
function isExit(x,y){return x===EXIT.x&&y===EXIT.y}
function valid(p){return p.x>=0&&p.x<N&&p.y>=0&&p.y<N}
function routeFrom(x,y,tiles=g.tiles){
  const key=(a,b)=>a+','+b,origin=key(x,y),goal=key(EXIT.x,EXIT.y);
  const q=[{x,y}],previous=new Map([[origin,null]]);
  for(let head=0;head<q.length;head++){
    const p=q[head],k=key(p.x,p.y);
    if(k===goal)break;
    for(const d of dirs){
      const a=p.x+d[0],b=p.y+d[1],z=key(a,b);
      if(a<0||a>=N||b<0||b>=N||previous.has(z))continue;
      const tile=tileAt(a,b,tiles);
      if(tile&&(tile.kind==='obstacle'||tile.kind==='tent')&&z!==origin)continue;
      previous.set(z,k);q.push({x:a,y:b})
    }
  }
  if(!previous.has(goal))return null;
  const out=[];let k=goal;
  while(k!==null){const parts=k.split(',').map(Number);out.push({x:parts[0],y:parts[1]});k=previous.get(k)}
  return out.reverse()
}
function routesRemain(tiles){
  const tents=tiles.filter(t=>t.kind==='tent');
  if(!tents.length)return false;
  if(tents.some(t=>!routeFrom(t.x,t.y,tiles)))return false;
  if(g.boardUnits.some(u=>!routeFrom(u.x,u.y,tiles)))return false;
  return true
}
function repath(){
  updatePreview()
}
function baseStats(){return{atk:10,hp:30,armor:2,rate:1,range:29}}
function applyBuff(stats,t){
  if(t.kind==='attack')stats.atk*=1+.1*t.level;
  if(t.kind==='defense')stats.armor+=2*t.level;
  if(t.kind==='shield')stats.hp+=5*t.level;
  if(t.kind==='haste')stats.rate*=1+.15*t.level;

function travel(unit,tiles=g.tiles){
  let p,dir;
  if(unit.forced!==null){dir=unit.forced;p={x:unit.x+dirs[dir][0],y:unit.y+dirs[dir][1]}}
  else{const route=routeFrom(unit.x,unit.y,tiles);if(!route||route.length<2)return{dead:'无路可走',p:{x:unit.x,y:unit.y}};p=route[1];dir=dirs.findIndex(d=>unit.x+d[0]===p.x&&unit.y+d[1]===p.y)}
  if(!valid(p))return{dead:'Buff 出口越界',p};
  const t=tileAt(p.x,p.y,tiles);
  if(t&&t.kind==='obstacle')return{dead:'Buff 出口撞上石头',p};
  if(t&&t.kind==='tent')return{dead:'营帐挡住出口',p};
  if(t&&t.kind!=='obstacle'&&t.kind!=='tent'&&t.entry!==(dir+2)%4)return{dead:'从 Buff 封闭面进入',p};

}
function projected(tent,tiles=g.tiles){

  const u={x:tent.x,y:tent.y,forced:null,stats:baseStats(),picked:new Set()},route=[{x:u.x,y:u.y}];
  for(let i=0;i<56;i++){

    const step=travel(u,tiles);route.push(step.p);
    if(step.dead)return{route,stats:u.stats,alive:false,reason:step.dead};
    u.x=step.p.x;u.y=step.p.y;u.forced=step.forced;
    if(step.t&&!u.picked.has(step.t.id)){u.picked.add(step.t.id);applyBuff(u.stats,step.t)}

}

    renderDraft()
  }
  g.allies=g.allies.filter(a=>a.hp>0)
}
function update(dt){
  if(g.phase!=='fight'||g.paused)return;
  g.time+=dt;
  const w=Math.min(MAX_WAVES,1+Math.floor(g.time/WAVE_MS));
  if(w!==g.wave){
    const wasEmpty=g.draftCredits===0;
    g.wave=w;g.refresh=3;g.meat+=25;g.draftCredits=Math.min(3,g.draftCredits+1);
    if(wasEmpty)rollOffers();
    hint('第 '+w+' 波来袭！获得 25 肉块和一次三选一机会。');sound(840,.2)
  }
  if(g.time<SPAWN_END&&g.time>=g.enemyAt){enemySpawn();g.enemyAt=g.time+Math.max(1700,2900-g.wave*175)}
  boardTick(dt,g.time<SPAWN_END);
  battleTick(dt);
  g.shots=g.shots.filter(s=>(s.life-=dt)>0);
  g.sparks=g.sparks.filter(s=>(s.life-=dt)>0);
  g.floaters=g.floaters.filter(s=>(s.life-=dt)>0);
  if(g.fort<=0){g.fort=0;finish(false)}
  else if(g.enemyFort<=0){g.enemyFort=0;finish(true)}
  else if(g.time>270000&&g.enemies.length===0&&g.allies.length===0&&g.belt.length===0&&g.boardUnits.length===0)finish(false);
  hud()
}
function finish(win){
  if(g.phase==='end')return;
  g.phase='end';cancelAnimationFrame(raf);
  if(win){
    const reward=35+Math.ceil(g.fort/4);save.wins++;save.coins+=reward;save.chests=Math.min(4,save.chests+1);persist();hud();
    modal('五波攻城成功！','<div class="reward">🏰 ✦ 🎁</div><p>历时 '+Math.ceil(g.time/1000)+' 秒，击败 '+g.kills+' 名敌人，棋盘阵亡 '+g.lost+' 名。获得 '+reward+' 金币和 1 个宝箱。</p>','返回营地',home)
  }else{
    save.coins+=10;persist();hud();
    modal('城门失守','<div class="reward">🛡️</div><p>坚持 '+Math.ceil(g.time/1000)+' 秒，击败 '+g.kills+' 名敌人，棋盘阵亡 '+g.lost+' 名。对照预览检查 Buff 的蓝色入口和金色出口。</p>','返回营地',home)
  }
}
function poly(c,points,fill,stroke='#1b2421',width=2){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(width){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function ellipse(c,x,y,rx,ry,fill,stroke='#1c2422',width=2){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);c.fillStyle=fill;c.fill();if(width){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function txt(c,s,x,y,size=13,color='#f1e2c6',align='center'){c.fillStyle=color;c.font='900 '+size+'px Trebuchet MS, sans-serif';c.textAlign=align;c.fillText(s,x,y)}
function soldier(c,x,y,scale=1,armed=0,enemy=false,boss=false){
  c.save();c.translate(x,y);c.scale(scale,scale);
  ellipse(c,0,18,boss?21:16,5,'#15201b77','#15201b00',0);
  const coat=enemy?(boss?'#a35b58':'#b99584'):(armed>1?'#829eb0':'#9aae9c');
  poly(c,[[-14,10],[-12,-9],[0,-15],[12,-9],[15,10]],coat);
  poly(c,[[-16,-8],[-18,-22],[-4,-13]],coat);
  poly(c,[[16,-8],[18,-22],[4,-13]],coat);
  ellipse(c,-5,-4,2,2,'#17211f','#17211f',0);ellipse(c,6,-4,2,2,'#17211f','#17211f',0);
  ellipse(c,1,5,8,5,enemy?'#e1b5a4':'#e8ddbe');
  ellipse(c,-2,5,1,1,'#5b4640','#5b4640',0);ellipse(c,4,5,1,1,'#5b4640','#5b4640',0);
  if(armed)poly(c,[[17,-16],[22,-17],[27,-6],[24,-1],[17,-5]],armed>2?'#f2ce7a':'#c7bd9e');
  else if(enemy)poly(c,[[17,2],[23,-16],[27,-14],[22,10]],'#90786a');
  if(boss)poly(c,[[-19,-19],[-11,-31],[0,-20],[10,-31],[20,-19]],'#dfbb63');
  c.restore()
}
function drawPorts(c,x,y,t){
  const positions=[[-20,0],[0,20],[20,0],[0,-20]];
  const a=positions[t.entry],b=positions[t.out];
  c.lineCap='round';c.lineJoin='round';
  for(const [width,color] of [[19,'#3d3027'],[15,'#ad7b48'],[8,'#edd19b']]){
    c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x+a[0],y+a[1]);c.lineTo(x,y);c.lineTo(x+b[0],y+b[1]);c.stroke()
  }
  ellipse(c,x+a[0],y+a[1],8,8,'#5abbd2','#1d3540',2);
  ellipse(c,x+a[0],y+a[1],4,4,'#235160','#235160',0);
  ellipse(c,x+b[0],y+b[1],8,8,'#edb861','#543b22',2);
  ellipse(c,x+b[0],y+b[1],3,3,'#fff0ad','#fff0ad',0);
  ellipse(c,x,y,12,12,'#f3dfaa','#59432e',2)
}
function drawBoard(){
  if(!g)return;
  bc.clearRect(0,0,420,421);bc.fillStyle='#3c5949';bc.fillRect(0,0,420,421);
  for(let i=0;i<29;i++){const x=(i*79)%420,y=(i*131)%421;bc.strokeStyle='#263f3359';bc.lineWidth=2;bc.beginPath();bc.moveTo(x,y);bc.lineTo(x+4,y-8);bc.lineTo(x+8,y);bc.stroke()}
  bc.lineCap='round';bc.lineJoin='round';bc.strokeStyle='#183535';bc.lineWidth=48;bc.beginPath();bc.moveTo(27,28);bc.lineTo(27,391);bc.lineTo(392,391);bc.lineTo(392,28);bc.lineTo(28,28);bc.stroke();bc.strokeStyle='#639e98';bc.lineWidth=37;bc.stroke();
  bc.strokeStyle='#b3d0b3';bc.lineWidth=2;bc.setLineDash([6,8]);bc.stroke();bc.setLineDash([]);
  for(let i=0;i<outerLens.length;i++)for(let j=1;j<=3;j++){const d=outerLens.slice(0,i).reduce((a,b)=>a+b,0)+outerLens[i]*j/4,p=outerPos(d);txt(bc,['‹','⌄','›','⌃','‹'][i],p.x,p.y+6,19,'#173d3e')}
  bc.fillStyle='#2f5c84';bc.fillRect(BX-7,BY-7,N*T+14,N*T+14);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){bc.fillStyle=(x+y)%2?'#dcc297':'#ebd2a8';bc.fillRect(BX+x*T,BY+y*T,T,T);bc.strokeStyle='#f6e3bd66';bc.lineWidth=1;bc.strokeRect(BX+x*T+.5,BY+y*T+.5,T,T)}
  for(const preview of g.previews||[]){bc.save();bc.setLineDash([5,5]);bc.lineWidth=5;bc.strokeStyle='#23352b';bc.beginPath();preview.route.forEach((p,i)=>{const x=BX+(p.x+.5)*T,y=BY+(p.y+.5)*T;i?bc.lineTo(x,y):bc.moveTo(x,y)});bc.stroke();bc.lineWidth=3;bc.strokeStyle=preview.alive?'#f7dc71':'#ef7166';bc.stroke();bc.restore();if(!preview.alive){const end=preview.route[preview.route.length-1];txt(bc,'✕',BX+(clamp(end.x,0,5)+.5)*T,BY+(clamp(end.y,0,5)+.5)*T+10,31,'#e95f5b')}}
  const ex=BX+(EXIT.x+.5)*T,ey=BY+(EXIT.y+.5)*T;
  bc.fillStyle='#6bb3b1';bc.fillRect(ex-21,ey-21,42,42);bc.strokeStyle='#143a3a';bc.lineWidth=3;bc.strokeRect(ex-21,ey-21,42,42);txt(bc,'⇐',ex,ey+8,27,'#183533');txt(bc,'出口',ex,ey+25,10,'#f9e4aa');
  for(const t of g.tiles){
    const x=BX+(t.x+.5)*T,y=BY+(t.y+.5)*T,spec=cards[t.kind];
    if(t.kind==='obstacle'){
      poly(bc,[[x-19,y+12],[x-16,y-8],[x-4,y-17],[x+7,y-10],[x+18,y-16],[x+20,y+12]],'#796c55','#242c26',3);
      for(let k=-1;k<=1;k++){bc.strokeStyle='#c7b189';bc.lineWidth=3;bc.beginPath();bc.moveTo(x+k*11-4,y-9);bc.lineTo(x+k*11+3,y+10);bc.stroke()}
    }else if(t.kind==='tent'){
      poly(bc,[[x-22,y+16],[x-14,y-14],[x,y-23],[x+14,y-14],[x+22,y+16]],'#e6d4a3','#453c32',3);
      poly(bc,[[x-8,y+14],[x,y-19],[x+8,y+14]],'#9a5548','#51362d',2);
      txt(bc,'营',x,y+8,15,'#fff1bf');
    }else{
      bc.fillStyle='#25302b77';bc.fillRect(x-18,y-13,40,41);
      bc.fillStyle=t.kind.startsWith('mult')?'#f1cf98':'#f0e1bc';bc.fillRect(x-21,y-21,42,42);
      bc.strokeStyle=selectedTile===t.id?'#f7db6e':'#6b5744';bc.lineWidth=selectedTile===t.id?4:3;bc.strokeRect(x-21,y-21,42,42);
      drawPorts(bc,x,y,t);
      txt(bc,spec.icon,x,y+5,t.kind.startsWith('mult')?11:16,t.kind==='attack'?'#8b4b43':'#263634')
    }
    if(selectedTile===t.id){bc.strokeStyle='#f7db6e';bc.lineWidth=3;bc.strokeRect(x-24,y-24,48,48)}
    if(t.level>1){ellipse(bc,x+17,y-19,12,10,'#eec96c');txt(bc,t.level,x+17,y-15,11,'#2a2924')}
  }
  if(g.pending&&chosen>=0){const o=g.offers[chosen],x=BX+(g.pending.x+.5)*T,y=BY+(g.pending.y+.5)*T;bc.save();bc.globalAlpha=.82;bc.fillStyle='#fff0b7';bc.fillRect(x-21,y-21,42,42);bc.strokeStyle='#f4d76d';bc.lineWidth=3;bc.strokeRect(x-21,y-21,42,42);if(o.kind==='tent')txt(bc,'营',x,y+7,18,'#614537');else{drawPorts(bc,x,y,o);txt(bc,cards[o.kind].icon,x,y+5,16,'#2e3933')}bc.restore()}
  for(const u of g.boardUnits){const x=BX+(u.x+.5)*T,y=BY+(u.y+.5)*T;soldier(bc,x,y,.65,u.stats.atk>11?2:1);if(u.flash>0){bc.globalAlpha=u.flash/360;ellipse(bc,x,y,20,20,'#efdf9966','#f4df97',2);bc.globalAlpha=1}}
  for(const u of g.belt){const p=outerPos(u.d);soldier(bc,p.x,p.y,.67,u.stats.atk>11?2:1);if(u.flash>0){bc.globalAlpha=u.flash/350;ellipse(bc,p.x,p.y,19,19,'#efdf9966','#f4df97',2);bc.globalAlpha=1}}
  for(const sp of g.sparks){if(sp.surface==='board'){bc.globalAlpha=clamp(sp.life/650,0,1);ellipse(bc,sp.x,sp.y,12,12,sp.color,sp.color,0);bc.globalAlpha=1}}
  poly(bc,[[5,309],[27,309],[47,338],[28,362],[5,355]],'#716759');txt(bc,'入带',24,334,10,'#fff0be');poly(bc,[[6,1],[41,1],[44,34],[18,46],[2,33]],'#786e62');txt(bc,'出征',22,27,11,'#fff0be');
  bc.strokeStyle='#111e1a';bc.lineWidth=4;bc.strokeRect(1,1,418,419)
}
function drawArena(){
  if(!g)return;
  ac.clearRect(0,0,420,180);ac.fillStyle='#394a46';ac.fillRect(0,0,420,180);ac.fillStyle='#293b37';ac.fillRect(0,0,420,75);
  for(let i=0;i<8;i++)poly(ac,[[i*65-20,92],[i*65+15,44+(i%3)*8],[i*65+70,92]],'#3f5048','#3f5048',0);
  ac.fillStyle='#776f66';ac.fillRect(0,87,420,93);
  for(let i=0;i<13;i++){const x=(i*71)%420,y=98+(i*47)%76;ellipse(ac,x,y,24,5,'#5a605760','#5a605700',0)}
  poly(ac,[[0,47],[13,21],[38,29],[47,74],[47,177],[0,177]],'#a09378');ac.fillStyle='#c9bc9c';ac.fillRect(2,40,43,12);txt(ac,'🏰',23,123,27);
  poly(ac,[[373,62],[389,38],[411,42],[420,64],[420,178],[373,174]],'#55504b');poly(ac,[[390,82],[411,91],[411,145],[390,151]],'#87484a');txt(ac,'⚑',396,106,25,'#dfc275');
  for(const a of g.allies){soldier(ac,a.x,a.y,.88,a.gear,false,false);ac.fillStyle='#16221c';ac.fillRect(a.x-16,a.y-29,32,4);ac.fillStyle='#a5c69d';ac.fillRect(a.x-16,a.y-29,32*clamp(a.hp/a.max,0,1),4)}
  for(const e of g.enemies){soldier(ac,e.x,e.y,e.boss?1.25:.88,0,true,e.boss);ac.fillStyle='#16221c';ac.fillRect(e.x-16,e.y-(e.boss?39:29),32,4);ac.fillStyle='#db8979';ac.fillRect(e.x-16,e.y-(e.boss?39:29),32*clamp(e.hp/e.max,0,1),4)}
  for(const s of g.shots){ac.globalAlpha=s.life/180;ac.strokeStyle=s.color;ac.lineWidth=3;ac.beginPath();ac.moveTo(s.x,s.y);ac.lineTo(s.tx,s.ty);ac.stroke();ac.globalAlpha=1}
  for(const sp of g.sparks){if(sp.surface==='arena'){ac.globalAlpha=sp.life/230;ellipse(ac,sp.x,sp.y,6,6,sp.color,sp.color,0);ac.globalAlpha=1}}
  for(const f of g.floaters){ac.globalAlpha=clamp(f.life/650,0,1);txt(ac,f.text,f.x,f.y-(650-f.life)*.035,12,f.color);ac.globalAlpha=1}
  ac.strokeStyle='#14211e';ac.lineWidth=4;ac.strokeRect(1,1,418,178)
}
function loop(now){
  if(!g||g.phase==='end')return;
  const dt=Math.min(45,now-last)*g.speed;last=now;update(dt);drawArena();drawBoard();raf=requestAnimationFrame(loop)
}
$('#startGame').onclick=()=>{
  if(save.energy<5){modal('体力不足','<p>当前版本可立即免费补充体力。</p>','补充体力',()=>{save.energy=20;persist();home()});return}
  save.energy-=5;persist();fresh()
};
$('#toHome').onclick=()=>modal('离开战斗？','<p>本场棋盘构筑与战斗进度不会保留。</p>','返回营地',()=>{cancelAnimationFrame(raf);g=null;home()});
$('#pauseBtn').onclick=()=>{if(!g)return;g.started=true;g.paused=!g.paused;hud();hint(g.paused?'已暂停，可以调整棋盘。':'营帐开始出兵，士兵正在棋盘内走向出口。')};
$('#speedBtn').onclick=()=>{if(!g)return;g.speed=g.speed===1?2:1;hud();sound(530)};
$('#recruitBtn').onclick=()=>{if(!g)return;const tent=g.tiles.find(t=>t.kind==='tent');if(tent&&spawnFrom(tent,true))hud()};
$('#refreshBtn').onclick=()=>{
  if(!g||g.phase==='end'||g.meat<10||g.refresh<=0||g.draftCredits<=0)return;
  g.meat-=10;g.refresh--;rollOffers();hud();hint('三张候选已重新随机；本波还可刷新 '+g.refresh+' 次。');sound(670,.12)
};
const help=()=>modal('战争工坊手册','<p>① 每局随机生成 5 块不可移动的石头。士兵从营帐出发，在普通格按到左下角出口的最短格数行军。</p><p>② Buff 是一段水管。蓝色敞口吸入士兵，金色喷嘴送往相邻格。喷嘴撞石头，或士兵从水管封闭的一侧进入，都会阵亡。黄色虚线代表安全路线，红线和叉号标出死亡位置。</p><p>③ 下方随机三选一。点卡再点空格试摆，再点一次确认；点已放置的 Buff 再点空格可移动。顶部显示预计攻击、生命、护甲、攻速。倍率按实际踩中顺序结算。</p><p>④ 营帐自动出兵。20 肉块立即招募，10 肉块重抽。击败 8 名敌人或进入新波次获得构筑机会。坚持五波、击败终局首领并攻破敌堡获胜。</p>','明白了');
$('#helpHome').onclick=help;$('#helpBattle').onclick=help;
$('#resetBtn').onclick=()=>modal('重置存档','<p>段位、金币和宝箱进度将清除。</p>','确认重置',()=>{save={coins:120,energy:20,wins:0,chests:0};persist();home()});
home();
})();
</script>
</body>
</html>
