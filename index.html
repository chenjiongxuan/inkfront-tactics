<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨线守城 · Inkfront</title>
<style>
:root{--ink:#191b1a;--cream:#eee6d5;--paper:#d3c8b3;--gold:#e6b854;--teal:#719f8b;--red:#bc6159;--dark:#252c2b}
*{box-sizing:border-box}body{margin:0;background:#101717;color:var(--cream);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='80' height='80' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");z-index:8}
button{font:inherit;cursor:pointer;touch-action:manipulation}.shell{max-width:460px;min-height:100dvh;margin:auto;background:linear-gradient(#304541,#202c2b 56%,#1b2828);position:relative;box-shadow:0 0 0 5px #111,0 0 35px #050807}.screen{display:none;padding:16px 16px 24px;min-height:100dvh}.screen.active{display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:1000;letter-spacing:.07em;color:#f2d284;font-size:24px;text-shadow:2px 3px #111}.resources{display:flex;gap:6px}.pill{border:2px solid #171b1a;background:#3f4941;border-radius:15px;padding:5px 8px;box-shadow:2px 3px #111;font-size:13px;font-weight:bold;white-space:nowrap}.pill span{color:#f6d374}.sketch{border:3px solid #141816;border-radius:12px 9px 15px 8px;box-shadow:3px 4px #101413,inset 0 0 0 2px #726956;background:#40534b}.rank{text-align:center;margin:20px 0 8px;padding:16px 10px;background:radial-gradient(ellipse at center,#3b5552,#243b3b 75%);position:relative}.rank:before,.rank:after{content:"✦";position:absolute;top:25px;color:#d8b967;font-size:25px}.rank:before{left:25px}.rank:after{right:25px}.rank h1{margin:3px 0;color:#f5e8cc;font-size:31px;letter-spacing:.12em;text-shadow:3px 3px #151a19}.rank small{color:#c1d2bd}.stars{color:#f3c753;font-size:27px;letter-spacing:5px;text-shadow:2px 3px #141816}.scene{height:188px;margin:8px 0 16px;position:relative;background:radial-gradient(ellipse at 50% 90%,#777253 0 27%,transparent 28%),linear-gradient(#314c49,#203c39);overflow:hidden}.moon{position:absolute;right:31px;top:15px;width:43px;height:43px;border-radius:50%;background:#dfd4a6;box-shadow:0 0 0 6px #a9ad8e44}.hill{position:absolute;bottom:32px;border:3px solid #151a19;border-radius:65% 60% 0 0;background:#58635b}.hill.a{left:-30px;width:190px;height:90px}.hill.b{right:-35px;width:205px;height:105px}.party{position:absolute;inset:auto 0 15px;display:flex;justify-content:center;gap:8px;align-items:end}.mascot{position:relative;width:67px;height:82px;filter:drop-shadow(3px 4px #101312)}.mascot:nth-child(2){transform:translateY(-9px)}.mascot svg{width:100%;height:100%}.cardrow{display:flex;gap:8px;margin:5px 0 10px}.hero-card{flex:1;text-align:center;padding:8px 2px 6px;background:#51645a;min-width:0}.hero-card b{display:block;font-size:14px;color:#fff0ca}.hero-card small{font-size:11px;color:#d1ddd0}.hero-card .icon{font-size:23px}.cta{border:3px solid #171712;border-radius:9px 12px 7px 12px;background:linear-gradient(#ffdb69,#d59131);color:#261f18;font-size:22px;font-weight:1000;padding:13px 10px;box-shadow:3px 5px #0d1211,inset 0 3px #fff3a0;transform:rotate(-.5deg)}.cta:active,.minor:active,.action:active{transform:translate(2px,3px)}.main-cta{width:100%;margin:4px 0 11px}.small-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chest{position:relative;min-height:79px;padding:6px 3px;background:#394947;color:#e7e5da;border:3px solid #141918;border-radius:8px;box-shadow:2px 3px #101413;text-align:center}.chest .chest-icon{display:block;font-size:29px;filter:drop-shadow(2px 2px #111)}.chest small{font-size:11px}.chest.ready{background:#635331;animation:pulse 1.8s infinite}.bottomnav{display:flex;margin-top:auto;padding-top:14px;gap:7px}.minor{flex:1;border:2px solid #151a18;border-radius:8px;background:#71928b;color:#13201d;font-weight:900;padding:10px 4px;box-shadow:2px 3px #111}.minor.selected{background:#f2c954}.tip{font-size:11px;text-align:center;opacity:.62;padding-top:10px}
.battle-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.back{border:2px solid #111;background:#d2c7aa;border-radius:8px;color:#1e2421;font-weight:bold;padding:6px 11px;box-shadow:2px 3px #111}.statline{display:flex;justify-content:space-between;margin:0 0 9px;gap:5px}.statline .pill{font-size:12px;padding:5px 6px}.field-wrap{position:relative;max-width:420px;margin:0 auto;width:100%;border:4px solid #141815;border-radius:10px;box-shadow:4px 5px #101413;background:#5b6257;overflow:hidden}.field-wrap:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;border:2px solid #c0af88}.field-wrap canvas{display:block;width:100%;touch-action:none}.field-caption{font-size:12px;color:#cbd0bb;text-align:center;margin:8px 0;min-height:20px}.phase{display:flex;gap:8px}.phase .cta{flex:1;font-size:17px;padding:9px}.phase .minor{flex:0 0 98px;background:#b2aa91}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 0}.tool{border:2px solid #171b19;background:#4c5a51;color:#f2ecdc;border-radius:8px;min-height:80px;padding:5px 2px;box-shadow:2px 3px #101413;position:relative}.tool.sel{background:#b6984f;color:#1d201a;transform:translateY(-3px);box-shadow:2px 6px #101413}.tool .emoji{font-size:24px;display:block}.tool b{display:block;font-size:12px}.tool small{display:block;font-size:10px}.tool:disabled{opacity:.4}.log{color:#d9d1b6;font-size:12px;line-height:1.5;margin-top:10px;text-align:center}.modal-wrap{position:fixed;inset:0;background:#060a09aa;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal-wrap.show{display:flex}.modal{max-width:410px;width:100%;background:#d9cbb1;border:4px solid #141815;box-shadow:6px 7px #080c0b;color:#21241e;border-radius:16px 11px 17px 9px;text-align:center;padding:20px 18px}.modal h2{font-size:25px;margin:0 0 11px}.modal p{font-size:14px;line-height:1.65}.modal .cta{width:100%;margin-top:10px;font-size:18px}.reward{font-size:44px;margin:15px}.two{display:flex;gap:8px}.two button{flex:1}@keyframes pulse{50%{filter:brightness(1.2)}}
@media(max-width:365px){.screen{padding:11px}.brand{font-size:20px}.pill{font-size:11px}.tool .emoji{font-size:19px}.tool b{font-size:10px}.tool small{font-size:9px}}@media(min-width:700px){body{padding:20px}.shell{min-height:calc(100dvh - 40px);border-radius:16px}.screen{min-height:calc(100dvh - 40px)}}
</style>
</head>
<body><div class="shell">
<main id="home" class="screen active">
 <div class="topbar"><div class="brand">✦ 墨线守城</div><div class="resources"><div class="pill">🪙 <span id="homeCoins">0</span></div><div class="pill">⚡ <span id="homeEnergy">0</span>/20</div></div></div>
 <section class="rank"><small>边境守卫 · 第 1 章</small><h1 id="rankName">青铜 · I</h1><div id="rankStars" class="stars">★★★☆☆</div><small id="winCount">累计胜利 0 场</small></section>
 <div class="scene sketch"><div class="moon"></div><div class="hill a"></div><div class="hill b"></div><div class="party" id="partyArt"></div></div>
 <div class="cardrow"><div class="hero-card sketch"><span class="icon">⚔️</span><b>铁甲小熊</b><small>近战 · 坚守</small></div><div class="hero-card sketch"><span class="icon">🏹</span><b>游侠小狐</b><small>远程 · 连射</small></div><div class="hero-card sketch"><span class="icon">✦</span><b>星纹法师</b><small>范围 · 爆破</small></div></div>
 <button id="startGame" class="cta main-cta">⚔ 开始守城 <small style="font-size:12px">⚡ 5</small></button>
 <div style="font-size:12px;margin:2px 0 8px;color:#d6c8a5">荣耀宝箱 <span style="opacity:.65">· 胜利后获得，点击开启</span></div><div class="small-grid" id="chests"></div>
 <div class="bottomnav"><button class="minor" id="helpHome">玩法</button><button class="minor selected">战斗</button><button class="minor" id="resetBtn">重置存档</button></div><div class="tip">离线可玩 · 点击英雄后选择空地布阵</div>
</main>
<main id="battle" class="screen">
 <div class="battle-head"><button id="toHome" class="back">‹ 返回</button><div class="brand" style="font-size:21px">黑石关</div><button id="helpBattle" class="back">?</button></div>
 <div class="statline"><div class="pill">🏰 城墙 <span id="hpLabel">10</span></div><div class="pill">🪙 <span id="battleCoins">0</span></div><div class="pill">🌊 <span id="waveLabel">1/3</span></div><div class="pill">⚔ <span id="killsLabel">0</span></div></div>
 <div class="field-wrap"><canvas id="field" width="420" height="570" aria-label="战场网格"></canvas></div>
 <div id="caption" class="field-caption">选择英雄，再点击深色空格布阵。</div>
 <div class="phase"><button id="waveBtn" class="cta">开始第 1 波</button><button id="speedBtn" class="minor">速度 ×1</button></div>
 <div class="tools" id="tools"></div><div class="log" id="battleLog">点击卡牌选择，再点击战场部署。敌人沿浅色道路攻向城墙。</div>
</main>
</div><div id="modalWrap" class="modal-wrap"><div class="modal" id="modal"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
if('scrollRestoration' in history)history.scrollRestoration='manual';
const SAVE='inkfront-tactics-v1';let save;try{save=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}save=Object.assign({coins:120,energy:20,wins:0,chests:0},save||{});
const persist=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};
const field=$('#field'),ctx=field.getContext('2d');const W=7,H=9,CELL=60,TOP=15;const route=[[3,0],[3,1],[3,2],[2,2],[1,2],[1,3],[1,4],[2,4],[3,4],[4,4],[5,4],[5,5],[5,6],[4,6],[3,6],[3,7],[3,8]],pathSet=new Set(route.map(p=>p.join(',')));
const classes={bear:{name:'铁甲小熊',icon:'⚔️',cost:0,range:1.7,damage:4,cool:660,color:'#bd8066'},fox:{name:'游侠小狐',icon:'🏹',cost:0,range:3.5,damage:3,cool:450,color:'#d2a663'},mage:{name:'星纹法师',icon:'✦',cost:0,range:2.8,damage:5,cool:1250,color:'#a695c7'},tower:{name:'箭塔',icon:'🗼',cost:25,range:2.7,damage:2,cool:850,color:'#988c68'},barricade:{name:'路障',icon:'🪵',cost:15,range:0,damage:0,cool:0,color:'#9e7d5c'}};
let g=null,selected='bear',raf=0,last=0,audio=null;const sound=(f=520,d=.07)=>{try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.6,audio.currentTime+d);v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}};
const show=id=>{$('.screen.active').classList.remove('active');$(id).classList.add('active');window.scrollTo(0,0)};
function modal(title,body,button='好的',action=()=>{}){$('#modal').innerHTML=`<h2>${title}</h2><div>${body}</div><button class="cta" id="modalOk">${button}</button>`;$('#modalWrap').classList.add('show');$('#modalOk').onclick=()=>{$('#modalWrap').classList.remove('show');action()}}
function home(){show('#home');$('#homeCoins').textContent=save.coins;$('#homeEnergy').textContent=save.energy;$('#winCount').textContent=`累计胜利 ${save.wins} 场`;const tier=Math.floor(save.wins/5),names=['青铜','白银','黄金','星耀'];$('#rankName').textContent=`${names[Math.min(tier,3)]} · ${['I','II','III','IV','V'][save.wins%5]}`;$('#rankStars').textContent='★'.repeat(save.wins%5)+'☆'.repeat(5-save.wins%5);$('#chests').innerHTML=Array.from({length:4},(_,i)=>`<button class="chest ${i<save.chests?'ready':''}" data-chest="${i}"><span class="chest-icon">${i<save.chests?'🎁':'🗃️'}</span><small>${i<save.chests?'点击开启':'空位'}</small></button>`).join('');document.querySelectorAll('.chest').forEach(el=>el.onclick=()=>{let n=+el.dataset.chest;if(n>=save.chests){sound(190);return}save.chests--;let gain=40+Math.floor(Math.random()*31);save.coins+=gain;persist();sound(900,.18);modal('宝箱开启',`<div class="reward">✨ 🪙 ✨</div><p>获得 ${gain} 枚金币！</p>`,'收下',home);home()})}
const mascot=(color,kind)=>`<div class="mascot"><svg viewBox="0 0 70 85" xmlns="http://www.w3.org/2000/svg"><g stroke="#171917" stroke-width="3" stroke-linejoin="round"><path fill="${color}" d="M16 31 L13 10 26 20 41 17 55 8 54 32 Q65 48 52 59 L18 61 Q6 50 16 31Z"/><path fill="#e6ddc3" d="M21 42 Q34 35 48 43 L45 56 Q32 63 23 54Z"/><path fill="${color}" d="M22 58 L16 79 29 79 34 67 40 79 55 79 48 56Z"/><path fill="#f2d6a0" d="M26 60 L44 60 43 68 29 68Z"/><path fill="#171917" d="M25 35 h3 m14 0 h3"/></g><text x="25" y="54" font-size="16">${kind}</text></svg></div>`;
$('#partyArt').innerHTML=mascot('#c28569','⚔')+mascot('#d5aa6b','✦')+mascot('#9a8db7','✧');
function fresh(){g={hp:10,maxHp:10,wave:0,coins:35,kills:0,phase:'setup',heroes:[],structures:[],enemies:[],shots:[],particles:[],spawnLeft:0,spawnAt:0,time:0,speed:1};selected='bear';show('#battle');renderTools();updateHUD();log('先部署三位英雄，再开始第 1 波。');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function log(s){$('#battleLog').textContent=s;$('#caption').textContent=s}
function updateHUD(){if(!g)return;$('#hpLabel').textContent=g.hp;$('#battleCoins').textContent=g.coins;$('#waveLabel').textContent=`${Math.min(g.wave+(g.phase==='setup'?1:0),3)}/3`;$('#killsLabel').textContent=g.kills;$('#waveBtn').textContent=g.phase==='setup'?`开始第 ${g.wave+1} 波`:g.phase==='fighting'?'敌军来袭中…':'战斗结束';$('#waveBtn').disabled=g.phase!=='setup';$('#speedBtn').textContent=`速度 ×${g.speed}`}
function renderTools(){let count=k=>g.heroes.filter(h=>h.kind===k).length;$('#tools').innerHTML=Object.entries(classes).map(([k,c])=>{let deployed=k==='tower'||k==='barricade'?'':`${count(k)}/1`;return `<button class="tool ${selected===k?'sel':''}" data-kind="${k}" ${g.phase==='ended'?'disabled':''}><span class="emoji">${c.icon}</span><b>${c.name}</b><small>${deployed||`🪙 ${c.cost}`}</small></button>`}).join('');document.querySelectorAll('.tool').forEach(el=>el.onclick=()=>{selected=el.dataset.kind;renderTools();sound(440);log(`已选择${classes[selected].name}。点击非道路空格部署。`)})}
function place(x,y){if(g.phase==='ended')return;if(x<0||x>=W||y<0||y>=H)return;const key=`${x},${y}`,kind=selected,c=classes[kind];if(pathSet.has(key)){log('这里是行军道路，请选择旁边的空地。');sound(170);return}if([...g.heroes,...g.structures].some(o=>o.x===x&&o.y===y)){log('该位置已有单位。');sound(170);return}if(['bear','fox','mage'].includes(kind)){if(g.heroes.some(o=>o.kind===kind)){log(`${c.name}已经上阵，每种英雄只能部署一位。`);sound(170);return}g.heroes.push({x,y,kind,hp:kind==='bear'?12:7,last:0})}else{if(g.phase!=='fighting'){log('箭塔和路障在战斗开始后才能建造。');return}if(g.coins<c.cost){log('金币不足，击败敌人可获得金币。');sound(170);return}g.coins-=c.cost;g.structures.push({x,y,kind,hp:kind==='barricade'?15:7,last:0})}sound(660);renderTools();updateHUD();log(`${c.name} 已部署。`)}
field.addEventListener('pointerdown',e=>{if(!g)return;const r=field.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);place(x,y)});
function startWave(){if(!g||g.phase!=='setup')return;if(g.heroes.length<3){log(`还需部署 ${3-g.heroes.length} 位英雄。`);sound(180);return}g.phase='fighting';g.wave++;g.spawnLeft=5+g.wave*3;g.spawnAt=0;log(`第 ${g.wave} 波开始！守住城墙。`);sound(770,.2);updateHUD()}
function spawn(){const elite=g.wave>1&&Math.random()<.23,hp=(elite?15:8)+g.wave*3;g.enemies.push({p:-.25,hp,max:hp,speed:(elite?.62:1.03)+g.wave*.07,elite,slow:0});g.spawnLeft--}
function pos(e){let n=Math.floor(Math.max(0,e.p)),t=clamp(e.p-n,0,1),a=route[Math.min(n,route.length-1)],b=route[Math.min(n+1,route.length-1)];return{x:(a[0]+(b[0]-a[0])*t+.5)*CELL,y:TOP+(a[1]+(b[1]-a[1])*t+.5)*CELL}}
function update(dt){if(g.phase!=='fighting')return;g.time+=dt;if(g.spawnLeft>0&&g.time>=g.spawnAt){spawn();g.spawnAt=g.time+900-g.wave*80}for(const e of g.enemies){if(e.hp<=0)continue;let p=pos(e),blocked=g.structures.some(b=>b.kind==='barricade'&&Math.hypot(p.x-(b.x+.5)*CELL,p.y-(TOP+(b.y+.5)*CELL))<CELL*1.35);e.p+=e.speed*dt/1000*(blocked?.42:e.slow>g.time?.55:1);if(e.p>=route.length-1){e.hp=0;g.hp-=e.elite?2:1;g.particles.push({x:210,y:TOP+8.5*CELL,t:350,color:'#d87961'});sound(140,.2)}}g.enemies=g.enemies.filter(e=>e.hp>0);for(const h of [...g.heroes,...g.structures]){let c=classes[h.kind];if(!c.damage||g.time-h.last<c.cool)continue;let best=null,dist=Infinity;for(const e of g.enemies){let p=pos(e),d=Math.hypot(p.x-(h.x+.5)*CELL,p.y-(TOP+(h.y+.5)*CELL))/CELL;if(d<c.range&&d<dist){dist=d;best=e}}if(best){h.last=g.time;let p=pos(best);best.hp-=c.damage;if(h.kind==='mage'){best.slow=g.time+900;for(const e of g.enemies){if(e!==best&&Math.hypot(pos(e).x-p.x,pos(e).y-p.y)<70)e.hp-=2}}g.shots.push({x:(h.x+.5)*CELL,y:TOP+(h.y+.5)*CELL,tx:p.x,ty:p.y,t:240,color:h.kind==='mage'?'#cbb1ef':'#f2d16c'});if(best.hp<=0){g.kills++;g.coins+=best.elite?15:7;g.particles.push({x:p.x,y:p.y,t:450,color:'#ead180'});sound(610)}}}g.enemies=g.enemies.filter(e=>e.hp>0);g.shots=g.shots.filter(s=>(s.t-=dt)>0);g.particles=g.particles.filter(p=>(p.t-=dt)>0);if(g.hp<=0){finish(false);return}if(g.spawnLeft===0&&g.enemies.length===0){if(g.wave>=3){finish(true)}else{g.phase='setup';g.coins+=20;log(`第 ${g.wave} 波守住了！获得 20 金币。准备下一波。`);sound(860,.2)}}updateHUD()}
function finish(win){g.phase='ended';cancelAnimationFrame(raf);if(win){save.wins++;save.coins+=35+g.hp*3;save.chests=Math.min(4,save.chests+1);persist();modal('守城成功！',`<div class="reward">🏰 ✦ 🎁</div><p>守住了黑石关！击败 ${g.kills} 名敌人，获得 ${35+g.hp*3} 枚金币和 1 个荣耀宝箱。</p>`,'返回营地',home)}else{save.coins+=10;persist();modal('城墙失守',`<div class="reward">🛡️</div><p>第 ${g.wave} 波敌人突破了防线。获得 10 枚金币。调整英雄位置再试一次。</p>`,'返回营地',home)}updateHUD()}
function loop(now){if(!g||g.phase==='ended')return;let dt=Math.min(40,now-last)*g.speed;last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
function poly(points,fill,stroke='#22201d',width=2){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,fill,stroke='#2b2b27',line=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}
function draw(){if(!g)return;ctx.fillStyle='#4f5e55';ctx.fillRect(0,0,420,570);ctx.fillStyle='#2b3e3b';ctx.fillRect(0,0,420,TOP);ctx.fillStyle='#514b43';ctx.fillRect(0,555,420,15);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let X=x*CELL,Y=TOP+y*CELL,path=pathSet.has(`${x},${y}`),j=((x*17+y*31)%7)-3;ctx.fillStyle=path?(y%2?'#a9a08b':'#aaa38f'):(y%2?'#69736a':'#657066');ctx.fillRect(X,Y,CELL,CELL);ctx.strokeStyle=path?'#817a6b':'#536057';ctx.lineWidth=1;ctx.strokeRect(X+.5,Y+.5,CELL,CELL);if(path){ctx.strokeStyle='#b9af96';ctx.beginPath();ctx.moveTo(X+7,Y+22+j);ctx.lineTo(X+23,Y+20+j);ctx.moveTo(X+36,Y+44-j);ctx.lineTo(X+53,Y+42-j);ctx.stroke()}else{ctx.strokeStyle='#3c5149';ctx.beginPath();ctx.moveTo(X+10,Y+40+j);ctx.lineTo(X+13,Y+36+j);ctx.lineTo(X+16,Y+40+j);ctx.moveTo(X+39,Y+17-j);ctx.lineTo(X+43,Y+12-j);ctx.lineTo(X+45,Y+17-j);ctx.stroke();if((x+y*5)%8===0)ellipse(X+49,Y+46,6,4,'#5f665b','#455148',1)}}
ctx.save();ctx.translate(210,TOP+8.5*CELL);poly([[-21,-14],[0,-28],[21,-14],[23,17],[-23,17]],'#56514a');ctx.fillStyle='#d3c6a7';ctx.fillRect(-14,-7,28,18);ctx.strokeStyle='#262522';ctx.lineWidth=3;ctx.strokeRect(-14,-7,28,18);ctx.fillStyle='#503e39';ctx.fillRect(-5,0,10,11);ctx.restore();
for(const o of g.structures)drawUnit(o);for(const o of g.heroes)drawUnit(o);for(const e of g.enemies){let p=pos(e);ellipse(p.x,p.y+15,17,6,'#222b2977','#222b2900',0);poly([[p.x-15,p.y+7],[p.x-17,p.y-9],[p.x-6,p.y-5],[p.x,p.y-15],[p.x+7,p.y-5],[p.x+17,p.y-8],[p.x+14,p.y+8]],e.elite?'#a45e59':'#c5b5a0');ellipse(p.x-6,p.y-1,2,2,'#1d2422','#1d2422',0);ellipse(p.x+6,p.y-1,2,2,'#1d2422','#1d2422',0);ctx.fillStyle='#202321';ctx.fillRect(p.x-17,p.y-24,34,5);ctx.fillStyle=e.elite?'#d87a6a':'#88b78c';ctx.fillRect(p.x-16,p.y-23,32*clamp(e.hp/e.max,0,1),3)}
for(const s of g.shots){ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.tx,s.ty);ctx.stroke();ellipse(s.tx,s.ty,4,4,s.color,s.color,0)}for(const p of g.particles){ctx.globalAlpha=p.t/450;ellipse(p.x,p.y,24-p.t/40,24-p.t/40,p.color,p.color,1);ctx.globalAlpha=1}ctx.strokeStyle='#292a24';ctx.lineWidth=5;ctx.strokeRect(2,TOP+2,416,536)}
function drawUnit(o){let x=(o.x+.5)*CELL,y=TOP+(o.y+.5)*CELL,c=classes[o.kind];ellipse(x,y+18,19,7,'#222b2966','#222b2900',0);if(o.kind==='tower'){poly([[x-15,y+15],[x-11,y-8],[x+11,y-8],[x+15,y+15]],'#9b9071');poly([[x-19,y-8],[x,y-23],[x+19,y-8]],'#61483c');ctx.fillStyle='#2a2722';ctx.fillRect(x-4,y-3,8,10)}else if(o.kind==='barricade'){for(let i=-1;i<=1;i++)poly([[x-21,y+i*10-3],[x+19,y+i*10-5],[x+21,y+i*10+3],[x-19,y+i*10+5]],'#937255')}else{poly([[x-17,y+16],[x-13,y-13],[x-5,y-7],[x,y-22],[x+7,y-7],[x+15,y-13],[x+17,y+16]],c.color);ellipse(x,y+2,15,12,'#dfd5ba');ellipse(x-6,y-7,2,2,'#191d1a','#191d1a',0);ellipse(x+6,y-7,2,2,'#191d1a','#191d1a',0);ctx.fillStyle='#352d26';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(o.kind==='bear'?'⚔':o.kind==='fox'?'⌁':'✦',x,y+9)}}
$('#startGame').onclick=()=>{if(save.energy<5){modal('体力不足','当前演示版可免费补充体力，继续体验。','补充体力',()=>{save.energy=20;persist();home()});return}save.energy-=5;persist();fresh()};$('#toHome').onclick=()=>{if(g&&g.phase==='fighting'){modal('离开战斗？','离开后本场战斗进度不会保留。','离开',()=>{cancelAnimationFrame(raf);g=null;home()})}else{cancelAnimationFrame(raf);g=null;home()}};$('#waveBtn').onclick=startWave;$('#speedBtn').onclick=()=>{if(!g)return;g.speed=g.speed===1?2:1;updateHUD();sound(500)};
const help=()=>modal('守城手册','<p>① 点击三张英雄卡，再点击地图上的深色空地布阵。每种英雄只能上阵一位。</p><p>② 点击“开始第 1 波”。敌人沿浅色道路前进；英雄自动攻击。</p><p>③ 战斗中击败敌人获得金币，可在空地建造箭塔或路障。共守住三波即获胜，胜利会带回金币和宝箱。</p>');$('#helpHome').onclick=help;$('#helpBattle').onclick=help;$('#resetBtn').onclick=()=>modal('重置存档','这会清除段位、金币和宝箱进度。','确认重置',()=>{save={coins:120,energy:20,wins:0,chests:0};persist();home()});home();
})();
